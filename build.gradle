plugins {
    id 'java'
    id 'application'
    id 'io.qameta.allure' version '3.0.0'
    id 'io.freefair.lombok' version '9.0.0'
}

group = 'com.appium'
version = '1.0-SNAPSHOT'

def allureVersion = "2.24.0"

compileJava.options.encoding = "UTF-8"
compileTestJava.options.encoding = "UTF-8"

repositories {
    mavenCentral()
}

allure{
    version = allureVersion
    useTestNG{
        version = allureVersion
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(
                JavaVersion.current().majorVersion.toInteger()
        )
    }
}

dependencies {
    testImplementation 'org.testng:testng:7.11.0'
    testImplementation 'org.hamcrest:hamcrest-core:3.0'
    implementation 'io.qameta.allure:allure-testng:2.24.0'
    implementation 'com.github.automatedowl:allure-environment-writer:1.0.0'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.19.2'
    implementation 'com.google.guava:guava:33.5.0-jre'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'org.slf4j:slf4j-api:2.0.17'
    implementation 'org.yaml:snakeyaml:2.5'
    testImplementation 'ch.qos.logback:logback-classic:1.5.18'
    testImplementation 'org.assertj:assertj-core:3.27.5'
    testImplementation 'org.awaitility:awaitility:4.3.0'
    implementation 'io.appium:java-client:10.0.0'
    implementation 'org.apache.commons:commons-lang3:3.20.0'
}

// 테스트 실행 전 이전 Allure 결과를 초기화하되, Trend 누적을 위해 history 폴더는 보존합니다. -> local test에서 리포트 확인용
tasks.register('cleanAllureResults') {
    doLast {
        def resultsDir = file("${buildDir}/allure-results")
        def historyDir = file("${buildDir}/allure-history-backup")

        // 1. 이전 history 폴더를 임시 위치에 백업
        if (file("${resultsDir}/history").exists()) {
            copy {
                from "${resultsDir}/history"
                into historyDir
            }
        }

        // 2. allure-results 전체 삭제 및 플러그인 충돌 폴더 삭제
        delete resultsDir
        delete "${buildDir}/copy-categories"

        // 3. history 폴더만 복원
        if (historyDir.exists()) {
            copy {
                from historyDir
                into "${resultsDir}/history"
            }
            delete historyDir
        }

        // 4. categories.json, allure.properties를 allure-results에 직접 복사 (플러그인 버그 우회)
        def categoriesFile = file("src/test/resources/categories.json")
        if (categoriesFile.exists()) {
            copy {
                from categoriesFile
                into resultsDir
            }
        }

        def allurePropertiesFile = file("src/test/resources/allure.properties")
        if (allurePropertiesFile.exists()) {
            copy {
                from allurePropertiesFile
                into resultsDir
            }
        }
    }
}
// allureServe, allureReport 실행 전 플러그인 충돌 폴더를 자동으로 삭제합니다.
tasks.register('cleanCopyCategories', Delete) {
    delete "${buildDir}/copy-categories"
}
afterEvaluate {
    tasks.named('allureServe') { dependsOn('cleanCopyCategories') }
    tasks.named('allureReport') {
        dependsOn('cleanCopyCategories')
        // 리포트 폴더명에 날짜를 붙여 생성 (예: allureReport-2026-03-24_09-00)
        def reportDate = new Date().format('yyyy-MM-dd_HH-mm')
        def reportFolder = file("${buildDir}/reports/allure-report/allureReport-${reportDate}")
        reportDir = reportFolder

        // 리포트 생성 후 history를 allure-results에 복사하여 다음 실행 시 Trend 누적
        doLast {
            def historySource = file("${reportFolder}/history")
            def historyDest = file("${buildDir}/allure-results/history")
            if (historySource.exists()) {
                copy {
                    from historySource
                    into historyDest
                }
                logger.lifecycle(">>> [Allure] Trend 누적을 위해 history를 allure-results에 복사 완료")
            }
        }
    }
}

test.dependsOn('cleanAllureResults')

ext.env = 'qa'
test {
    systemProperty 'env', System.properties['env'] ?: "${env}"
    useTestNG(){
        //property 에는 보통 repository name을 넣는다.
        if(project.hasProperty("test1")){
            suites 'src/test/resources/suites/example.xml'
        }else if(project.hasProperty("smoke_test")){
            suites 'src/test/resources/suite/suite.xml'
        }
//        else{
//            exclude '**/**'
//        }
    }

    testLogging {
        showStandardStreams = true
        showCauses = true
        showExceptions = true
        showStackTraces = true
        exceptionFormat = 'full'
        events "PASSED", "FAILED", "SKIPPED"
    }
}